spring.application.name=student-app
server.port=8080

# Practice database defaults. Change these for any real application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db}
spring.datasource.username=${DB_USER:studentapp}
spring.datasource.password=${DB_PASSWORD:studentapp123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
